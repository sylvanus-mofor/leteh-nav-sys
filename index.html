<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a73e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Leteh Navigation System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.css"/>
<style>
:root {
  --blue: #1a73e8;
  --blue-dark: #1557b0;
  --blue-light: #e8f0fe;
  --blue-mid: #4285f4;
  --green: #0f9d58;
  --green-light: #e6f4ea;
  --red: #d93025;
  --red-light: #fce8e6;
  --yellow: #f9ab00;
  --yellow-light: #fef7e0;
  --purple: #8430ce;
  --surface: #ffffff;
  --surface-2: #f8f9fa;
  --surface-3: #f1f3f4;
  --border: #dadce0;
  --text-primary: #202124;
  --text-secondary: #5f6368;
  --text-hint: #9aa0a6;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 28px rgba(0,0,0,0.15), 0 4px 12px rgba(0,0,0,0.08);
  --radius: 12px;
  --radius-lg: 20px;
  --radius-pill: 100px;
  --teal: #237f7e;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #e8eaed;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  color: var(--text-primary);
}

/* ─── MAP BASE ─── */
#map {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.leaflet-control-zoom { display: none; }

/* ─── TOP SEARCH BAR ─── */
.top-bar {
  position: absolute;
  top: 12px; left: 12px; right: 12px;
  z-index: 800;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.search-pill {
  background: var(--surface);
  border-radius: var(--radius-pill);
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px 0 14px;
  height: 52px;
  pointer-events: all;
  transition: box-shadow 0.2s;
}
.search-pill:focus-within {
  box-shadow: var(--shadow-lg), 0 0 0 2px var(--blue-light);
}
.search-pill-icon { color: var(--blue); font-size: 20px; flex-shrink: 0; }
.search-pill input {
  flex: 1;
  border: none;
  outline: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  color: var(--text-primary);
  background: transparent;
}
.search-pill input::placeholder { color: var(--text-hint); }
.search-pill-actions { display: flex; gap: 4px; flex-shrink: 0; }
.icon-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  transition: background 0.15s;
  color: var(--text-secondary);
}
.icon-btn:hover { background: var(--surface-3); }
.icon-btn:active { background: var(--border); transform: scale(0.93); }

/* ─── CATEGORY CHIPS ─── */
.category-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
  pointer-events: all;
  scrollbar-width: none;
}
.category-chips::-webkit-scrollbar { display: none; }
.chip {
  background: var(--surface);
  border: none;
  border-radius: var(--radius-pill);
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 500;
  font-family: 'DM Sans', sans-serif;
  color: var(--text-secondary);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
  transition: all 0.15s;
  flex-shrink: 0;
}
.chip:hover { box-shadow: var(--shadow-md); }
.chip.active { background: var(--blue); color: white; }
.chip:active { transform: scale(0.96); }

/* ─── SEARCH RESULTS DROPDOWN ─── */
.search-dropdown {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  pointer-events: all;
  display: none;
  max-height: 300px;
  overflow-y: auto;
}
.search-dropdown.open { display: block; }
.search-result-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  cursor: pointer;
  transition: background 0.12s;
  border-bottom: 1px solid var(--surface-3);
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background: var(--surface-2); }
.sri-icon {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--surface-3);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.sri-body { flex: 1; min-width: 0; }
.sri-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sri-lm { font-size: 12px; color: var(--text-secondary); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sri-dist { font-size: 12px; color: var(--blue); font-weight: 600; flex-shrink: 0; }

/* ─── FAB CLUSTER ─── */
.fab-cluster {
  position: absolute;
  right: 14px;
  bottom: 130px;
  z-index: 700;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}
.fab {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--surface);
  border: none;
  box-shadow: var(--shadow-md);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  transition: all 0.2s;
  color: var(--text-secondary);
}
.fab:hover { box-shadow: var(--shadow-lg); transform: scale(1.05); }
.fab:active { transform: scale(0.93); }
.fab.primary {
  width: 56px; height: 56px;
  background: var(--blue);
  color: white;
  font-size: 22px;
}
.fab.green { background: var(--green); color: white; }

/* ─── WEATHER TAB ─── */
.weather-tab {
  background: var(--surface);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 16px 20px 24px;
  max-width: 480px;
  margin: 0 auto;
}

.weather-current {
  background: linear-gradient(145deg, #1a73e8, #0d47a1);
  color: white;
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.weather-current-icon {
  font-size: 64px;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
}

.weather-current-temp {
  font-size: 42px;
  font-weight: 700;
  line-height: 1;
}

.weather-current-desc {
  font-size: 14px;
  opacity: 0.9;
  margin-top: 4px;
}

.weather-farming-tip {
  background: var(--green-light);
  border-left: 4px solid var(--green);
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.weather-farming-tip-icon {
  font-size: 24px;
  flex-shrink: 0;
}

.weather-farming-tip-text {
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.5;
  font-weight: 500;
}

.weather-days {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 8px;
  scrollbar-width: none;
}

.weather-days::-webkit-scrollbar {
  display: none;
}

.weather-day-card {
  flex: 0 0 auto;
  width: 100px;
  background: var(--surface-2);
  border-radius: var(--radius);
  padding: 12px 8px;
  text-align: center;
  border: 1px solid var(--border);
}

.weather-day-name {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
}

.weather-day-icon {
  font-size: 32px;
  margin: 8px 0;
}

.weather-day-temp {
  font-size: 15px;
  font-weight: 700;
  color: var(--blue);
}

.weather-day-rain {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
}

.weather-sun-times {
  background: var(--surface-2);
  border-radius: var(--radius);
  padding: 16px;
  margin: 16px 0;
  display: flex;
  justify-content: space-around;
  border: 1px solid var(--border);
}

.weather-sun-item {
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.weather-sun-icon {
  font-size: 24px;
}

.weather-sun-label {
  font-size: 11px;
  color: var(--text-secondary);
}

.weather-sun-time {
  font-size: 15px;
  font-weight: 600;
}

.weather-alert {
  background: var(--yellow-light);
  border: 1px solid var(--yellow);
  border-radius: var(--radius);
  padding: 12px 16px;
  display: flex;
  gap: 12px;
  align-items: center;
  margin-top: 16px;
}

.weather-alert-icon {
  font-size: 24px;
}

.weather-alert-text {
  font-size: 13px;
  font-weight: 500;
  color: #b06000;
  flex: 1;
}

/* Weather button in FAB cluster */
.fab.weather {
  background: var(--purple);
  color: white;
}

/* ─── BOTTOM SHEET ─── */
.bottom-sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 900;
  pointer-events: none;
}
.bottom-sheet-inner {
  background: var(--surface);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
  pointer-events: all;
  transform: translateY(0);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.sheet-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 10px auto 0;
}

/* ─── PLACE DETAIL SHEET ─── */
.place-sheet { padding: 0 0 20px; }
.place-header {
  padding: 16px 20px 14px;
  border-bottom: 1px solid var(--surface-3);
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.place-icon-wrap {
  width: 52px; height: 52px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  flex-shrink: 0;
}
.place-title { font-size: 18px; font-weight: 700; line-height: 1.2; }
.place-cat { font-size: 13px; color: var(--text-secondary); margin-top: 3px; }
.place-landmark-desc {
  padding: 12px 20px;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
  border-bottom: 1px solid var(--surface-3);
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.place-landmark-desc span { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.place-actions {
  display: flex;
  gap: 10px;
  padding: 14px 20px 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.place-actions::-webkit-scrollbar { display: none; }
.place-action-btn {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  background: var(--surface-2);
  border: none;
  border-radius: var(--radius);
  padding: 12px 18px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
  cursor: pointer;
  transition: all 0.15s;
  min-width: 72px;
}
.place-action-btn:hover { background: var(--blue-light); }
.place-action-btn:active { transform: scale(0.95); }
.place-action-btn .pab-icon { font-size: 20px; }
.place-action-btn.red { color: var(--red); }
.place-action-btn.red:hover { background: var(--red-light); }

/* ─── NAVIGATION PANEL ─── */
.nav-panel {
  padding: 16px 20px 20px;
}
.nav-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.nav-header h3 { font-size: 16px; font-weight: 700; flex: 1; }
.nav-stop {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--surface-3);
}
.nav-stop:last-of-type { border-bottom: none; }
.nav-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.nav-dot.start { background: var(--green); }
.nav-dot.end { background: var(--red); }
.nav-stop-label { font-size: 14px; flex: 1; }
.nav-stop-label span { display: block; font-size: 11px; color: var(--text-hint); margin-top: 1px; }
.nav-line { width: 2px; height: 20px; background: var(--border); margin: 0 4px; }
.nav-summary {
  display: flex;
  gap: 12px;
  margin: 14px 0 0;
  background: var(--blue-light);
  border-radius: var(--radius);
  padding: 12px 16px;
}
.nav-stat { flex: 1; text-align: center; }
.nav-stat-val { font-size: 20px; font-weight: 700; color: var(--blue); }
.nav-stat-lbl { font-size: 11px; color: var(--text-secondary); margin-top: 2px; font-weight: 500; }

/* ─── STEP-BY-STEP DIRECTIONS ─── */
.dir-steps { margin-top: 4px; }
.dir-step {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--surface-3);
  align-items: flex-start;
}
.dir-step:last-child { border-bottom: none; }
.dir-step-num {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--blue);
  color: white;
  font-size: 11px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.dir-step-text { font-size: 13px; line-height: 1.5; color: var(--text-primary); }
.dir-step-sub { font-size: 11px; color: var(--blue); font-weight: 600; margin-top: 2px; }

/* ─── SHARE SHEET ─── */
.share-panel { padding: 16px 20px 24px; }
.share-panel h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.share-panel p { font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; line-height: 1.5; }
.share-link-box {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--blue);
  word-break: break-all;
  margin-bottom: 12px;
}
.share-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.share-opt {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  text-align: center;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  transition: all 0.15s;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.share-opt:hover { background: var(--blue-light); border-color: var(--blue); color: var(--blue); }
.share-opt span { font-size: 22px; }

/* ─── SUBMIT EDIT PANEL ─── */
.edit-panel { padding: 16px 20px 24px; overflow-y: auto; max-height: 60vh; }
.edit-panel h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.edit-panel p { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.5; }
.field-group { margin-bottom: 14px; }
.field-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--text-secondary);
  margin-bottom: 6px;
  display: block;
}
.field-input, .field-textarea, .field-select {
  width: 100%;
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
.field-input:focus, .field-textarea:focus, .field-select:focus {
  border-color: var(--blue);
  background: white;
}
.field-textarea { resize: vertical; min-height: 75px; }
.field-hint { font-size: 11px; color: var(--text-hint); margin-top: 4px; line-height: 1.5; }

.cat-row { display: flex; gap: 8px; flex-wrap: wrap; }
.cat-chip {
  padding: 7px 14px;
  border-radius: var(--radius-pill);
  border: 1.5px solid var(--border);
  background: white;
  font-size: 12px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  transition: all 0.15s;
}
.cat-chip.sel { border-color: var(--blue); background: var(--blue-light); color: var(--blue); }

.submit-btn {
  width: 100%;
  background: var(--blue);
  color: white;
  border: none;
  border-radius: var(--radius-pill);
  padding: 15px;
  font-size: 15px;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  margin-top: 6px;
  transition: background 0.2s;
  letter-spacing: 0.2px;
}
.submit-btn:active { background: var(--blue-dark); transform: scale(0.98); }

/* ─── ADMIN PANEL ─── */
.admin-overlay {
  position: fixed;
  inset: 0;
  background: rgba(32,33,36,0.6);
  backdrop-filter: blur(4px);
  z-index: 2000;
  display: none;
  align-items: flex-end;
}
.admin-overlay.open { display: flex; }
.admin-sheet {
  background: var(--surface);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  width: 100%;
  max-height: 90dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: slideUp 0.28s cubic-bezier(0.4,0,0.2,1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.admin-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.admin-header h2 { font-size: 17px; font-weight: 700; flex: 1; }
.admin-badge {
  background: var(--blue);
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  letter-spacing: 0.3px;
}
.admin-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.admin-tab {
  flex: 1;
  padding: 12px;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.admin-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
.admin-body { flex: 1; overflow-y: auto; padding: 14px 16px 24px; }

.pending-card {
  background: white;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
  transition: box-shadow 0.15s;
}
.pending-card:hover { box-shadow: var(--shadow-sm); }
.pc-header {
  padding: 12px 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border-bottom: 1px solid var(--surface-3);
}
.pc-icon { font-size: 24px; flex-shrink: 0; }
.pc-meta { flex: 1; min-width: 0; }
.pc-name { font-size: 14px; font-weight: 700; }
.pc-lm { font-size: 12px; color: var(--text-secondary); margin-top: 3px; line-height: 1.4; }
.pc-time { font-size: 11px; color: var(--text-hint); margin-top: 4px; }
.pc-actions { display: flex; border-top: 1px solid var(--surface-3); }
.pc-btn {
  flex: 1;
  padding: 11px;
  border: none;
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}
.pc-btn.approve { color: var(--green); }
.pc-btn.approve:hover { background: var(--green-light); }
.pc-btn.reject { color: var(--red); }
.pc-btn.reject:hover { background: var(--red-light); }
.pc-btn:first-child { border-right: 1px solid var(--surface-3); }

.live-card {
  background: white;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.lc-icon { font-size: 22px; flex-shrink: 0; }
.lc-body { flex: 1; min-width: 0; }
.lc-name { font-size: 13px; font-weight: 600; }
.lc-cat { font-size: 11px; color: var(--text-secondary); }
.lc-del {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--red-light);
  color: var(--red);
  font-size: 15px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}
.lc-del:hover { background: var(--red); color: white; }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-hint);
}
.empty-state-icon { font-size: 40px; margin-bottom: 10px; }
.empty-state-text { font-size: 14px; font-weight: 500; }

.status-pill {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: var(--radius-pill);
  display: inline-block;
}
.status-pill.pending { background: var(--yellow-light); color: #b06000; }
.status-pill.approved { background: var(--green-light); color: #0a7a3e; }
.status-pill.rejected { background: var(--red-light); color: var(--red); }

/* ─── MODALS ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(32,33,36,0.55);
  backdrop-filter: blur(3px);
  z-index: 3000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--surface);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 380px;
  overflow: hidden;
  animation: popIn 0.22s cubic-bezier(0.4,0,0.2,1);
  box-shadow: var(--shadow-lg);
}
@keyframes popIn {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.modal-box-inner { padding: 24px; }
.modal-box-inner h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.modal-box-inner p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 20px; }
.modal-actions { display: flex; gap: 10px; }
.modal-btn {
  flex: 1;
  padding: 12px;
  border-radius: var(--radius-pill);
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
.modal-btn.secondary { background: var(--surface-3); color: var(--text-primary); }
.modal-btn.primary { background: var(--blue); color: white; }
.modal-btn:active { transform: scale(0.97); }

/* ─── LOCATION SHARE BANNER ─── */
.share-banner {
  position: absolute;
  top: 74px; left: 12px; right: 12px;
  z-index: 750;
  background: var(--green);
  color: white;
  border-radius: var(--radius-pill);
  padding: 10px 18px;
  display: none;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow-md);
  font-size: 13px;
  font-weight: 600;
  animation: slideDown 0.25s ease;
}
.share-banner.show { display: flex; }
@keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.share-banner-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #80e0b0;
  flex-shrink: 0;
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }

/* ─── NAV PROGRESS BAR (active route) ─── */
.nav-progress {
  position: absolute;
  top: 72px; left: 12px; right: 12px;
  z-index: 750;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 12px 16px;
  display: none;
  align-items: center;
  gap: 12px;
}
.nav-progress.show { display: flex; }
.nav-progress-info { flex: 1; }
.nav-progress-dest { font-size: 14px; font-weight: 700; }
.nav-progress-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.nav-progress-btn {
  background: var(--red-light);
  color: var(--red);
  border: none;
  border-radius: var(--radius-pill);
  padding: 7px 14px;
  font-size: 12px;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
}

/* ─── TOAST ─── */
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--text-primary);
  color: white;
  padding: 10px 20px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 500;
  z-index: 9999;
  opacity: 0;
  transition: all 0.25s;
  pointer-events: none;
  white-space: nowrap;
  max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── ADD PLACE MAP HINT ─── */
.map-hint {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 600;
  pointer-events: none;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.map-hint.show { display: flex; }
.map-hint-cross { font-size: 40px; color: var(--blue); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
.map-hint-label {
  background: var(--text-primary);
  color: white;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
}

/* ─── RESPONSIVE ─── */
@media (min-width: 600px) {
  .top-bar { left: 20px; right: 20px; max-width: 480px; }
  .bottom-sheet-inner { max-width: 480px; margin: 0 auto; }
  .fab-cluster { right: 20px; }
  .map-logo { left: 20px; }
  .share-banner, .nav-progress { max-width: 540px; left: 50%; transform: translateX(-50%); right: auto; }
}

/* Leaflet routing styles */
.leaflet-routing-container { display: none !important; }

/* ─── MARKET DAY BANNER ─── */
.market-day-pill {
  position: absolute;
  top: 130px; left: 12px;
  z-index: 790;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border-radius: var(--radius-pill);
  box-shadow: var(--shadow-md);
  padding: 7px 14px 7px 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 2px solid transparent;
  transition: box-shadow 0.2s;
  max-width: calc(100vw - 80px);
}
.market-day-pill:hover { box-shadow: var(--shadow-lg); }
.market-day-pill.big-market  { border-color: var(--green);  background: var(--green-light);  color: #0a7a3e; }
.market-day-pill.small-market{ border-color: var(--yellow); background: var(--yellow-light); color: #8a5a00; }
.market-day-pill.no-farm     { border-color: var(--purple); background: #f3e8ff;             color: #5a1e8c; }
.market-day-pill.regular     { border-color: var(--border);  background: var(--surface);     color: var(--text-secondary); }
.market-day-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; background: var(--text-hint); }
.market-day-pill.big-market   .market-day-dot { background: var(--green); }
.market-day-pill.small-market .market-day-dot { background: var(--yellow); }
.market-day-pill.no-farm      .market-day-dot { background: var(--purple); }

/* ─── NOTICE FAB ─── */
.notice-fab-wrap {
  position: absolute;
  left: 14px; bottom: 190px;
  z-index: 700;
}
.notice-dot {
  position: absolute;

}
.notice-dot.show { display: block; }

/* ─── LOGO (bottom center, subtle) ─── */
.map-logo {

  bottom: 10px;

  transform: translateX(-50%);

.mdr-countdown { font-size:12px; font-weight:600; color:var(--blue); flex-shrink:0; }

/* ─── NOTICE SHEET ─── */
.notice-sheet { padding:16px 20px 28px; }
.notice-card {
  background:var(--surface-2); border:1.5px solid var(--border);

}
.notice-card.urgent { border-color:var(--red);   background:var(--red-light); }
.notice-card.info   { border-color:var(--blue);  background:var(--blue-light); }
.notice-card.event  { border-color:var(--green); background:var(--green-light); }
.notice-title { font-size:14px; font-weight:700; margin-bottom:4px; }

.notice-meta  { font-size:11px; color:var(--text-hint); margin-top:8px; }
.notice-expires { color:var(--red); font-weight:600; }
.notice-type-pill {
  display:inline-block; font-size:10px; font-weight:700;
  padding:2px 8px; border-radius:var(--radius-pill);
  text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;
}
.notice-type-pill.urgent { background:var(--red);   color:white; }
.notice-type-pill.info   { background:var(--blue);  color:white; }
.notice-type-pill.event  { background:var(--green); color:white; }

/* ─── ZONE LABELS ─── */
.zone-label { background:transparent!important; border:none!important; box-shadow:none!important; }
.zone-label-inner {
  font-family:'DM Sans',sans-serif; font-size:11px; font-weight:700;

  text-shadow:0 1px 3px rgba(255,255,255,0.95),0 -1px 3px rgba(255,255,255,0.95),
              1px 0 3px rgba(255,255,255,0.95),-1px 0 3px rgba(255,255,255,0.95);
  white-space:nowrap; pointer-events:none; user-select:none;
}

/* ─── LANDMARK DIRECTIONS ─── */
.lm-directions {
  background:var(--green-light); border:1.5px solid var(--green);
  border-radius:var(--radius); padding:14px 16px; margin-top:12px;
}
.lm-directions-title {
  font-size:11px; font-weight:700; letter-spacing:0.8px;
  text-transform:uppercase; color:var(--green); margin-bottom:10px;
}
.lm-dir-step { display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-bottom:1px solid rgba(15,157,88,0.15); }
.lm-dir-step:last-child { border-bottom:none; padding-bottom:0; }
.lm-dir-num {
  width:22px; height:22px; border-radius:50%; background:var(--green); color:white;
  font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; margin-top:1px;
}
.lm-dir-text { font-size:13px; line-height:1.5; color:var(--text-primary); }

/* ─── SEASONAL FARMLAND ─── */
.season-banner {
  background:linear-gradient(135deg,#1b5e20,#2e7d32); color:white;
  border-radius:var(--radius); padding:14px 16px; margin-bottom:12px;
  display:flex; align-items:center; gap:14px;
}
.season-icon { font-size:36px; flex-shrink:0; }
.season-name { font-size:15px; font-weight:700; }
.season-desc { font-size:12px; opacity:0.88; margin-top:3px; line-height:1.5; }
.crop-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.crop-card {
  background:var(--surface-2); border:1.5px solid var(--border);
  border-radius:var(--radius); padding:12px;
  display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center;
}
.crop-card.active  { border-color:var(--green);  background:var(--green-light); }
.crop-card.harvest { border-color:var(--yellow); background:var(--yellow-light); }
.crop-icon   { font-size:26px; }
.crop-name   { font-size:12px; font-weight:700; }
.crop-status { font-size:11px; color:var(--text-secondary); }
</style>
</head>

let landmarks = [];
let pendingEdits = [];
let currentCat = 'all';
let activeModal = null;
let routingControl = null;
let userMarker = null;
let userLocation = null;
let sharingInterval = null;
let pickingMode = false;
let pendingAdd = {};
let activeAdminTab = 0;

function loadData() {
  try {
    const stored = localStorage.getItem('mmuock_landmarks');
    const version = localStorage.getItem('mmuock_version');
    if (!version || version !== 'v1') {
      landmarks = [...SEED];
      localStorage.setItem('mmuock_version', 'v1');
    } else {
      landmarks = stored ? JSON.parse(stored) : [...SEED];
    }
    const pe = localStorage.getItem('mmuock_pending');
    pendingEdits = pe ? JSON.parse(pe) : [];
  } catch(e) {
    landmarks = [...SEED];
    pendingEdits = [];
  }
}
function saveData() {
  localStorage.setItem('mmuock_landmarks', JSON.stringify(landmarks));
  localStorage.setItem('mmuock_pending', JSON.stringify(pendingEdits));
}
function liveLandmarks() {
  return landmarks.filter(l => l.status === 'live');
}

// ══════════════════════════════════════════════════════
// MAP INIT
// ══════════════════════════════════════════════════════
let map;

function initMap() {
  map = L.map('map', {
    center: HOME, zoom: ZOOM,
    zoomControl: false,
    attributionControl: false,
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    subdomains: ['a','b'],
    crossOrigin: true,
  }).addTo(map);

  L.control.attribution({ prefix: '<a href="https://osm.org">© OpenStreetMap</a>' }).addTo(map);

  map.on('click', onMapClick);
  renderAllMarkers();
  renderZoneLabels();
  initMarketDayBanner();
}

function mkIcon(cat) {
  const m = CAT_META[cat] || CAT_META.landmark;
  return L.divIcon({
    className: '',
    html: `<div style="
      background:${m.color};width:38px;height:38px;
      border-radius:50% 50% 50% 4px;
      transform:rotate(-45deg);
      border:3px solid white;
      box-shadow:0 3px 10px rgba(0,0,0,0.25);
      display:flex;align-items:center;justify-content:center;
      font-size:17px;
    "><span style="transform:rotate(45deg)">${m.icon}</span></div>`,
    iconSize:[38,38], iconAnchor:[19,38], popupAnchor:[0,-40]
  });
}

const markerMap = {}; // id → leaflet marker

function renderAllMarkers() {
  Object.values(markerMap).forEach(m => map.removeLayer(m));
  Object.keys(markerMap).forEach(k => delete markerMap[k]);

  liveLandmarks().forEach(lm => {
    if (currentCat !== 'all' && lm.cat !== currentCat) return;
    const marker = L.marker([lm.lat, lm.lng], { icon: mkIcon(lm.cat) });
    const m = CAT_META[lm.cat] || CAT_META.landmark;
    marker.bindPopup(`
      <div style="padding:10px;min-width:170px;">
        <div style="font-weight:700;font-size:14px;">${m.icon} ${lm.name}</div>
        <div style="font-size:12px;color:#5f6368;margin:4px 0 10px;line-height:1.5;">
          ${lm.landmark.substring(0,90)}${lm.landmark.length>90?'…':''}
        </div>
        <button onclick="openPlaceSheet('${lm.id}')"
          style="background:#1a73e8;color:white;border:none;border-radius:20px;
          padding:7px 16px;font-size:12px;font-weight:700;width:100%;cursor:pointer;
          font-family:'DM Sans',sans-serif;">
          Details & Navigate
        </button>
      </div>
    `, { maxWidth: 220 });
    marker.on('click', () => openPlaceSheet(lm.id));
    marker.addTo(map);
    markerMap[lm.id] = marker;
  });
}

function onMapClick(e) {
  if (pickingMode) {
    pendingAdd.lat = e.latlng.lat;
    pendingAdd.lng = e.latlng.lng;
    stopPickMode();
    showEditSheet(pendingAdd);
  }
}

// SEARCH
// ══════════════════════════════════════════════════════
let searchTimer;
function onSearchInput(val) {
  clearTimeout(searchTimer);
  if (!val.trim()) { closeDropdown(); return; }
  searchTimer = setTimeout(() => showDropdown(val.trim()), 200);
}
function onSearchFocus() {
  const v = document.getElementById('searchInput').value.trim();
  if (v) showDropdown(v);
}
function onSearchBlur() { setTimeout(closeDropdown, 200); }
function closeDropdown() {
  document.getElementById('searchDropdown').classList.remove('open');
}

function showDropdown(q) {
  const lcase = q.toLowerCase();
  const matches = liveLandmarks().filter(lm =>
    lm.name.toLowerCase().includes(lcase) ||
    lm.landmark.toLowerCase().includes(lcase) ||
    (lm.notes||'').toLowerCase().includes(lcase) ||
    (lm.tags||[]).join(' ').toLowerCase().includes(lcase)
  ).slice(0, 8);

  const dd = document.getElementById('searchDropdown');
  if (!matches.length) { dd.innerHTML = `<div style="padding:16px;text-align:center;color:#9aa0a6;font-size:13px;">No results found</div>`; }
  else {
    dd.innerHTML = matches.map(lm => {
      const m = CAT_META[lm.cat] || CAT_META.landmark;
      const dist = userLocation ? ' · ' + fmtDist(haversine(userLocation[0],userLocation[1],lm.lat,lm.lng)) : '';
      return `<div class="search-result-item" onclick="selectSearchResult('${lm.id}')">
        <div class="sri-icon" style="background:${m.bg}">${m.icon}</div>
        <div class="sri-body">
          <div class="sri-name">${lm.name}</div>
          <div class="sri-lm">${lm.landmark.substring(0,60)}…</div>
        </div>
        <div class="sri-dist">${dist}</div>
      </div>`;
    }).join('');
  }
  dd.classList.add('open');
}

function selectSearchResult(id) {
  closeDropdown();
  document.getElementById('searchInput').value = '';
  const lm = landmarks.find(l => l.id === id);
  if (!lm) return;
  map.setView([lm.lat, lm.lng], 17, { animate: true });
  setTimeout(() => { if (markerMap[id]) markerMap[id].openPopup(); }, 350);
  openPlaceSheet(id);
}

// ══════════════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════════════
function startNavigateTo(destId) {
  const dest = landmarks.find(l => l.id === destId);
  if (!dest) return;
  hideSheet();

  if (!userLocation) {
    showConfirm(
      '📍 Location needed',
      'To navigate, we need your GPS location. Tap "Enable" to share your location.',
      'Enable GPS',
      () => {
        locateMe(() => buildRoute(dest));
      }
    );
    return;
  }
  buildRoute(dest);
}

function buildRoute(dest) {
  if (routingControl) { map.removeControl(routingControl); routingControl = null; }

  const start = L.latLng(userLocation[0], userLocation[1]);
  const end = L.latLng(dest.lat, dest.lng);

  routingControl = L.Routing.control({
    waypoints: [start, end],
    routeWhileDragging: false,
    addWaypoints: false,
    draggableWaypoints: false,
    fitSelectedRoutes: true,
    lineOptions: {
      styles: [{ color: '#1a73e8', opacity: 0.9, weight: 6 }],
      extendToWaypoints: true,
      missingRouteTolerance: 0
    },
    createMarker: () => null,
  }).addTo(map);

  routingControl.on('routesfound', function(e) {
    const route = e.routes[0];
    const dist = fmtDist(route.summary.totalDistance);
    const time = Math.ceil(route.summary.totalTime / 60) + ' min';

    document.getElementById('navProgressDest').textContent = '→ ' + dest.name;
    document.getElementById('navProgressSub').textContent = `${dist} · Est. ${time}`;
    document.getElementById('navProgress').classList.add('show');

    showNavSheet(dest, route);
  });

  map.fitBounds([userLocation, [dest.lat, dest.lng]], { padding: [60, 60] });
}

function showNavSheet(dest, route) {
  const m = CAT_META[dest.cat] || CAT_META.landmark;
  const dist = fmtDist(route.summary.totalDistance);
  const time = Math.ceil(route.summary.totalTime / 60);

  const steps = (route.instructions || []).slice(0, 8).map((s, i) => `
    <div class="dir-step">
      <div class="dir-step-num">${i+1}</div>
      <div>
        <div class="dir-step-text">${s.text}</div>
        ${s.distance > 5 ? `<div class="dir-step-sub">~${fmtDist(s.distance)}</div>` : ''}
      </div>
    </div>
  `).join('');

  const lmSteps = getLandmarkDirections(dest);
  const lmHTML = lmSteps.length ? `
    <div class="lm-directions">
      <div class="lm-directions-title">🏘️ Local Landmark Guide</div>
      ${lmSteps.map((s,i) => `
        <div class="lm-dir-step">
          <div class="lm-dir-num">${i+1}</div>
          <div class="lm-dir-text">${s}</div>
        </div>`).join('')}
    </div>` : '';

  showSheet(`
    <div class="nav-panel">
      <div class="nav-header">
        <span>${m.icon}</span>
        <h3>Route to ${dest.name}</h3>
        <button class="icon-btn" onclick="stopNavigation()">✕</button>
      </div>
      <div style="display:flex;gap:12px;margin-bottom:14px;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
          <div class="nav-dot start"></div>
          <div class="nav-line"></div>
          <div class="nav-dot end"></div>
        </div>
        <div style="flex:1;">
          <div class="nav-stop" style="border:none;padding:0 0 12px;">
            <div class="nav-stop-label">Your Location <span>Current position</span></div>
          </div>
          <div class="nav-stop" style="border:none;padding:0;">
            <div class="nav-stop-label">${dest.name} <span>${dest.landmark.substring(0,50)}…</span></div>
          </div>
        </div>
      </div>
      <div class="nav-summary">
        <div class="nav-stat"><div class="nav-stat-val">${dist}</div><div class="nav-stat-lbl">Distance</div></div>
        <div class="nav-stat"><div class="nav-stat-val">${time}</div><div class="nav-stat-lbl">Minutes</div></div>
        <div class="nav-stat"><div class="nav-stat-val">${m.icon}</div><div class="nav-stat-lbl">${m.label}</div></div>
      </div>
      ${lmHTML}
      <div style="margin-top:14px;">
        <div style="font-size:12px;font-weight:700;color:#5f6368;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:8px;">Turn-by-Turn Directions</div>
        <div class="dir-steps">
          ${steps || `<div class="dir-step"><div class="dir-step-num">1</div><div><div class="dir-step-text">${dest.landmark}</div></div></div>`}
        </div>
      </div>
    </div>
  `);
}

function stopNavigation() {
  if (routingControl) { map.removeControl(routingControl); routingControl = null; }
  document.getElementById('navProgress').classList.remove('show');
  hideSheet();
}

// ══════════════════════════════════════════════════════
// LOCATE ME
// ══════════════════════════════════════════════════════
function locateMe(callback) {
  if (!navigator.geolocation) { showToast('GPS not available'); return; }
  showToast('Finding your location…');
  navigator.geolocation.getCurrentPosition(pos => {
    userLocation = [pos.coords.latitude, pos.coords.longitude];
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker(userLocation, {
      radius: 10, fillColor: '#1a73e8', color: 'white', weight: 3, fillOpacity: 1,
    }).addTo(map).bindPopup('📍 You are here');
    // Accuracy circle
    L.circle(userLocation, {
      radius: pos.coords.accuracy,
      color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 0.08, weight: 1, dashArray: '4'
    }).addTo(map);
    map.setView(userLocation, 16, { animate: true });
    showToast('✓ Location found');
    if (callback) callback();
  }, () => { showToast('Could not get location. Enable GPS.'); }, { timeout: 12000 });
}

}

function shareMyLocation() {
  if (!navigator.geolocation) { showToast('GPS not available'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    userLocation = [pos.coords.latitude, pos.coords.longitude];
    const lat = pos.coords.latitude.toFixed(6);
    const lng = pos.coords.longitude.toFixed(6);
    const shareUrl = `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}&zoom=17`;
    const waUrl = `https://wa.me/?text=${encodeURIComponent('My location: ' + shareUrl)}`;
    const smsUrl = `sms:?body=${encodeURIComponent('My location: ' + shareUrl)}`;

    document.getElementById('shareLocContent').innerHTML = `
      <div class="share-link-box">${shareUrl}</div>
      <div class="share-grid">
        <button class="share-opt" onclick="navigator.clipboard&&navigator.clipboard.writeText('${shareUrl}');showToast('Link copied!')">
          <span>📋</span>Copy Link
        </button>
        <button class="share-opt" onclick="window.open('${waUrl}','_blank')">
          <span>💬</span>WhatsApp
        </button>
        <button class="share-opt" onclick="window.open('${smsUrl}')">
          <span>📱</span>SMS
        </button>
        <button class="share-opt" onclick="startLiveShare(${lat},${lng})">
          <span>🔴</span>Live Share
        </button>
        <button class="share-opt" onclick="addFromCurrentLocation()" style="grid-column:span 2;background:#e8f0fe;border-color:#1a73e8;">
          <span>➕</span>Add Place Here
        </button>
      </div>
      <p style="margin-top:12px;font-size:12px;color:#9aa0a6;line-height:1.5;">
        📌 Coordinates: ${lat}, ${lng}
      </p>
    `;
  }, () => { showToast('Enable GPS to share location'); });
}

function sharePlace(id) {
  const lm = landmarks.find(l => l.id === id);
  if (!lm) return;
  const url = `https://www.openstreetmap.org/?mlat=${lm.lat}&mlon=${lm.lng}&zoom=17`;
  const text = `${lm.name} – ${lm.landmark} | Leteh Navigation`;
  showSheet(`
    <div class="share-panel">
      <h3>📤 Share: ${lm.name}</h3>
      <p>${lm.landmark}</p>
      <div class="share-link-box">${url}</div>
      <div class="share-grid">
        <button class="share-opt" onclick="navigator.clipboard&&navigator.clipboard.writeText('${url}');showToast('Copied!')">
          <span>📋</span>Copy Link
        </button>
        <button class="share-opt" onclick="window.open('https://wa.me/?text=${encodeURIComponent(text + ' ' + url)}','_blank')">

// ADD FROM CURRENT LOCATION
// ══════════════════════════════════════════════════════
function addFromCurrentLocation() {
  if (!navigator.geolocation) { 
    showToast('GPS not available'); 
    return; 
  }
  
  showToast('Getting your location…');
  
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      
      // Set the pending add location
      pendingAdd = {
        lat: lat,
        lng: lng
      };
      
      // Show the edit sheet with coordinates
      showEditSheet(pendingAdd, null);
      
      // Add a temporary marker at the location
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker([lat, lng], {
        radius: 10, 
        fillColor: '#1a73e8', 
        color: 'white', 
        weight: 3, 
        fillOpacity: 1,
      }).addTo(map).bindPopup('📍 Adding place here');
      
      // Center map on location
      map.setView([lat, lng], 18, { animate: true });
      
      showToast('✓ Location found! Add place details below');
    },
    error => {
      console.error('Geolocation error:', error);
      showToast('Could not get your location. Please enable GPS.');
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}

      name: edit.name, cat: edit.cat, lat: edit.lat, lng: edit.lng,

  } else if (edit.type === 'edit' && edit.existingId) {

    if (orig) {

      orig.cat = edit.cat;

function haversine(lat1,lng1,lat2,lng2) {
  const R=6371000, d2r=Math.PI/180;
  const dLat=(lat2-lat1)*d2r, dLng=(lng2-lng1)*d2r;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*d2r)*Math.cos(lat2*d2r)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function fmtDist(m) {
  return m < 1000 ? Math.round(m)+'m' : (m/1000).toFixed(1)+'km';
}

// Simple hash function
async function hashPassword(password) {
  const msgBuffer = new TextEncoder().encode(password);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// Simple weather cache
let weatherCache = {
  data: null,
  timestamp: 0,
  lat: null,
  lng: null
};

function showWeather() {
  if (!userLocation) {
    showConfirm(
      '📍 Location Needed',
      'Your location is needed to show weather. Tap "Enable" to continue.',
      'Enable GPS',
      () => {
        locateMe(() => fetchAndShowWeather());
      }
    );
    return;
  }
  
  fetchAndShowWeather();
}

function fetchAndShowWeather() {
  const lat = userLocation[0];
  const lng = userLocation[1];
  
  // Check cache (valid for 30 minutes)
  const now = Date.now();
  if (weatherCache.data && 
      weatherCache.lat === lat && 
      weatherCache.lng === lng && 
      now - weatherCache.timestamp < 30 * 60 * 1000) {
    showWeatherSheet(weatherCache.data);
    return;
  }
  
  showToast('Loading weather…');
  
  // Using Open-Meteo API (free, no API key required)
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&current_weather=true&timezone=auto&forecast_days=7`;
  
  fetch(url)
    .then(response => response.json())
    .then(data => {
      // Cache the data
      weatherCache = {
        data: data,
        timestamp: Date.now(),
        lat: lat,
        lng: lng
      };
      
      showWeatherSheet(data);
    })
    .catch(error => {
      console.error('Weather fetch error:', error);
      showToast('Could not load weather. Using offline forecast.');
      showOfflineWeather();
    });
}

  const today = weatherData.daily;
  const rainToday = today.precipitation_probability_max[0];
  const rainTomorrow = today.precipitation_probability_max[1] || 0;
  const tempMax = today.temperature_2m_max[0];
  const tempMin = today.temperature_2m_min[0];

  let farmingText = '';
  let clothingText = '';

  if (rainToday > 70) {
    icon = '🌱';
    farmingText = 'Heavy rain today. Good for planting!';
  } else if (rainToday > 40) {
    icon = '💧';
    farmingText = 'Rain today. Soil will be wet.';
  } else if (tempMax > 32) {
    icon = '☀️';

  } else if (rainToday < 20) {
    icon = '🚜';
    farmingText = 'Dry days. Good for farm work.';
  } else {
    icon = '🌿';
    farmingText = 'Good farming weather.';
  }
  
  // CLOTHING & ADVICE
  if (tempMax < 10) {
    clothingText = '❄️ Wear heavy coat, gloves.';
  } else if (tempMax < 18) {
    clothingText = '🧥 Cool - wear jacket.';
  } else if (tempMax > 30) {
    clothingText = '☀️ Very hot - light clothes, hat.';
  }
  
  if (rainToday > 60) {
    clothingText = '☔ Take umbrella! ' + clothingText;
  } else if (rainToday > 30) {
    clothingText = '🌂 Carry umbrella. ' + clothingText;
  }
  
  // Combine texts
  const fullText = farmingText + ' ' + clothingText;
  
  return {
    icon: icon,
    text: fullText.trim()
  };
}

function getDayName(index) {
  const today = new Date();
  const targetDay = new Date(today);
  targetDay.setDate(today.getDate() + index);
  
  if (index === 0) return 'Today';
  if (index === 1) return 'Tomorrow';
  
  // Show day name and date (e.g., "Tue 18")
  const dayName = targetDay.toLocaleDateString('en-US', { weekday: 'short' });
  const date = targetDay.getDate();
  return `${dayName} ${date}`;
}

const MARKET_ANCHOR = new Date(2026, 1, 20); // 20 Feb 2026 = Mboegnwa

function getMarketDayIndex(date) {
  const anchor = new Date(MARKET_ANCHOR.getFullYear(), MARKET_ANCHOR.getMonth(), MARKET_ANCHOR.getDate());
  const target = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const diff = Math.round((target - anchor) / 86400000);
  return ((diff % 8) + 8) % 8;
}

function initMarketDayBanner() {
  const today = new Date();
  const idx = getMarketDayIndex(today);
  const day = MARKET_DAYS[idx];
  const pill = document.getElementById('marketDayPill');
  const text = document.getElementById('marketDayText');
  text.textContent = day.icon + ' ' + day.name;
  pill.className = 'market-day-pill';
  if      (day.type === 'big')    pill.classList.add('big-market');
  else if (day.type === 'small')  pill.classList.add('small-market');
  else if (day.type === 'nofarm') pill.classList.add('no-farm');
  else                            pill.classList.add('regular');
  // Notice dot
  if (getActiveNotices().length > 0) document.getElementById('noticeDot').classList.add('show');
}

function showMarketCalendar() {
  const today = new Date();
  const todayIdx = getMarketDayIndex(today);
  const rows = MARKET_DAYS.map((day, i) => {
    const isToday = i === todayIdx;
    const daysAhead = ((i - todayIdx) + 8) % 8;
    const target = new Date(today); target.setDate(today.getDate() + daysAhead);
    const dateStr = target.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
    let rowClass = 'market-day-row';
    if (isToday)          rowClass += ' today';
    else if (day.type === 'big')    rowClass += ' big';
    else if (day.type === 'small')  rowClass += ' small';
    else if (day.type === 'nofarm') rowClass += ' nofarm';
    const badge = isToday
      ? `<span class="mdr-badge today-badge">TODAY</span>`
      : `<span class="mdr-countdown">in ${daysAhead}d</span>`;
    return `<div class="${rowClass}">
      <div class="mdr-icon">${day.icon}</div>
      <div class="mdr-body">
        <div class="mdr-name">${day.name}</div>
        <div class="mdr-desc">${dateStr} · ${day.desc}</div>

  showSheet(`<div class="market-sheet" style="max-height:75vh;overflow-y:auto;">

}

// ══════════════════════════════════════════════════════
// LANDMARK-BASED DIRECTIONS
// ══════════════════════════════════════════════════════
function getBearing(lat1, lng1, lat2, lng2) {
  const d = Math.PI/180;
  const y = Math.sin((lng2-lng1)*d)*Math.cos(lat2*d);
  const x = Math.cos(lat1*d)*Math.sin(lat2*d) - Math.sin(lat1*d)*Math.cos(lat2*d)*Math.cos((lng2-lng1)*d);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function bearingToCardinal(deg) {
  return ['north','north-east','east','south-east','south','south-west','west','north-west'][Math.round(deg/45)%8];
}

function getLandmarkDirections(dest) {
  const steps = [];
  if (!dest) return steps;
  const MARKET = { lat:5.6349, lng:10.0359 };
  const ANCHORS = [
    { name:'3 Corners junction', lat:5.6344, lng:10.0369, id:'s7' },
    { name:'the Catholic Hospital', lat:5.6305, lng:10.0414, id:'s8' },
    { name:'the Fotang Health Centre', lat:5.6265, lng:10.0323, id:'s15' },
    { name:"the Fon's Palace", lat:5.6463, lng:10.0374, id:'s6' },
  ];
  const distFromMarket = haversine(MARKET.lat, MARKET.lng, dest.lat, dest.lng);
  if (distFromMarket < 80) {
    steps.push('Start at Nkongle Market — your destination is right here at the market.');
    return steps;
  }
  steps.push('Start at Nkongle Market (the main market in the centre of Leteh).');
  const dir = bearingToCardinal(getBearing(MARKET.lat, MARKET.lng, dest.lat, dest.lng));
  const useful = ANCHORS.filter(a => a.id !== dest.id && haversine(a.lat, a.lng, dest.lat, dest.lng) < distFromMarket);
  useful.sort((a,b) => haversine(a.lat,a.lng,dest.lat,dest.lng)-haversine(b.lat,b.lng,dest.lat,dest.lng));
  if (useful.length > 0) {
    const via = useful[0];
    const dirToVia = bearingToCardinal(getBearing(MARKET.lat,MARKET.lng,via.lat,via.lng));
    steps.push(`Head ${dirToVia} from the market (~${fmtDist(haversine(MARKET.lat,MARKET.lng,via.lat,via.lng))}) towards ${via.name}.`);
    const dirFinal = bearingToCardinal(getBearing(via.lat,via.lng,dest.lat,dest.lng));
    steps.push(`From ${via.name}, continue ${dirFinal} about ${fmtDist(haversine(via.lat,via.lng,dest.lat,dest.lng))}.`);
  } else {
    steps.push(`Head ${dir} from the market for about ${fmtDist(distFromMarket)}.`);
  }
  steps.push(`Look for: ${dest.landmark}`);
  return steps;
}

  if (m>=8 && m<=10) return {
    name:'Main Harvest Season', icon:'🌾',
    desc:'September–November. Rains easing. Main harvest time.',
    crops:[
      {icon:'🌽',name:'Maize',      status:'Harvesting!',    harvest:true},
      {icon:'🫘',name:'Beans',      status:'Harvesting!',    harvest:true},
      {icon:'🥔',name:'Potatoes',   status:'Growing, spray and prepare to harvest',    active:true},
      {icon:'🌿',name:'Cocoyam',    status:'Begin harvest',  harvest:true},
      {icon:'🍌',name:'Plantain',   status:'Harvest bunches',harvest:true},
      {icon:'🥬',name:'Vegetables', status:'Plant 2nd crop', active:true},
    ],
    tips:['Dry maize well before storage to avoid mould.','Good time to sell produce at Nkongle Market.','Second planting starts in October.']
  };
  return {
    name:'Dry Season & Rest', icon:'☀️',
    desc:'December–February. Dry season. Rest land, maintain tools, plan for next season.',
    crops:[
      {icon:'🌽',name:'Maize',      status:'In storage',     active:false},
      {icon:'🫘',name:'Beans',      status:'In storage',     active:false},
      {icon:'🥔',name:'Potatoes',   status:'Seeds in storage. Plant when rains return in March',    active:true},
      {icon:'🌿',name:'Cocoyam',    status:'Late harvest',   harvest:true},
      {icon:'🍌',name:'Plantain',   status:'Harvest bunches',harvest:true},
      {icon:'🥬',name:'Vegetables', status:'Dry-season veg', active:true},
    ],
    tips:['Good time to clear and prepare farms for planting season.','Check seeds and order more if needed.','Get hoes, cutlasses, sprayers and other farm tools ready.']
  };
}

function showSeasonalFarmland() {
  const s = getCurrentSeason();
  const cropCards = s.crops.map(c =>
    `<div class="crop-card ${c.harvest?'harvest':c.active?'active':''}">
      <div class="crop-icon">${c.icon}</div>
      <div class="crop-name">${c.name}</div>
      <div class="crop-status">${c.status}</div>
    </div>`).join('');
  const tips = s.tips.map(t =>
    `<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--surface-3);">
      <span style="font-size:16px;flex-shrink:0;">💡</span>
      <div style="font-size:13px;line-height:1.5;">${t}</div>
    </div>`).join('');
  const monthName = new Date().toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  showSheet(`<div style="padding:16px 20px 28px;max-height:75vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 style="font-size:16px;font-weight:700;">🌾 Farming Calendar</h3>
      <button class="icon-btn" onclick="hideSheet()">✕</button>
    </div>
    <div class="season-banner">
      <div class="season-icon">${s.icon}</div>
      <div>
        <div class="season-name">${s.name}</div>
        <div class="season-desc">${s.desc}</div>
      </div>
    </div>
    <div style="font-size:11px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px;">${monthName} — Crop Status</div>
    <div class="crop-grid">${cropCards}</div>
    <div style="font-size:11px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:4px;">Farming Tips This Month</div>
    ${tips}
    <div style="margin-top:14px;background:var(--blue-light);border-radius:var(--radius);padding:12px 14px;font-size:12px;color:var(--blue-dark);">
      📍 Visit the <strong>Agric Post</strong> on S'hê-Ntsi'hi for seeds and fertiliser.
    </div>
  </div>`);
}

// ══════════════════════════════════════════════════════
// SERVICE WORKER (offline tiles)
// ══════════════════════════════════════════════════════
if ('serviceWorker' in navigator) {
  const sw = `
const TC='mmuock-tiles-v1';
self.addEventListener('install',()=>self.skipWaiting());
self.addEventListener('activate',()=>self.clients.claim());
self.addEventListener('fetch',e=>{
  if(e.request.url.includes('tile.openstreetmap.org')){
    e.respondWith(caches.open(TC).then(async c=>{
      const r=await c.match(e.request);
      if(r) return r;
      try{const res=await fetch(e.request);if(res.ok)c.put(e.request,res.clone());return res;}
      catch{return new Response('',{status:503});}
    }));
  }
});`;
  const blob = new Blob([sw], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob));
}
